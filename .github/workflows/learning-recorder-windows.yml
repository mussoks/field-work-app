name: learning-recorder (Windows build)

on:
  push:
    paths:
      - "learning-recorder/**"
      - ".github/workflows/learning-recorder-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: learning-recorder
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Self-test from source (real screen record + capture)
        run: python src/main.py --selftest "$env:RUNNER_TEMP\selftest_src"

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --windowed
          --name LearningRecorder
          --collect-all imageio_ffmpeg
          --hidden-import pynput.keyboard._win32
          --hidden-import pynput.mouse._win32
          --paths src
          src/main.py

      - name: Self-test the built exe
        shell: pwsh
        run: |
          $out = "$env:RUNNER_TEMP\selftest_exe"
          $p = Start-Process -FilePath "dist\LearningRecorder.exe" -ArgumentList "--selftest", "`"$out`"" -Wait -PassThru
          Get-Content "$out\selftest_result.json" -Encoding utf8
          if ($p.ExitCode -ne 0) { throw "exe selftest failed: $($p.ExitCode)" }

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: LearningRecorder-windows
          path: learning-recorder/dist/LearningRecorder.exe

      - name: Upload self-test samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selftest-samples
          path: |
            ${{ runner.temp }}/selftest_src
            ${{ runner.temp }}/selftest_exe
