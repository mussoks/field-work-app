name: learning-recorder (Windows installer)

on:
  push:
    paths:
      - "learning-recorder/**"
      - ".github/workflows/learning-recorder-windows.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: utf-8
    defaults:
      run:
        working-directory: learning-recorder
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies (for source self-test)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Self-test from source (real screen record + capture)
        run: python src/main.py --selftest "$env:RUNNER_TEMP\selftest_src"

      - name: Ensure Inno Setup 6
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found" }

      - name: Build app (build.bat)
        shell: cmd
        env:
          SKIP_INSTALLER: "1"
        run: build.bat

      - name: Self-test the built app
        run: |
          function Run-Test($exe, $arg, $out, $files) {
            $p = Start-Process -FilePath $exe -ArgumentList $arg, "`"$out`"" -PassThru
            if (-not $p.WaitForExit(240000)) { Stop-Process -Id $p.Id -Force; Write-Host "TIMEOUT" }
            foreach ($f in $files) { if (Test-Path "$out\$f") { Write-Host "===== $f"; Get-Content "$out\$f" -Encoding utf8 | Out-Host } }
            Write-Host "exit code: $($p.ExitCode)"
            return [int]$p.ExitCode
          }
          $exe = "dist\LearningRecorder\LearningRecorder.exe"
          $a = Run-Test $exe "--selftest" "$env:RUNNER_TEMP\selftest_exe" @("selftest_progress.txt", "selftest_error.txt", "selftest_result.json")
          $b = Run-Test $exe "--ui-smoketest" "$env:RUNNER_TEMP\ui_shots" @("ui_error.txt", "ui_result.json")
          if (Test-Path "$env:APPDATA\LearningRecorder\error.log") { Get-Content "$env:APPDATA\LearningRecorder\error.log" -Encoding utf8 | Out-Host }
          if ($a -ne 0) { throw "selftest failed: $a" }
          if ($b -ne 0) { throw "ui smoketest failed: $b" }

      - name: Build installer (Inno Setup)
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Q /DMyAppVersion=0.2.0 installer\LearningRecorder.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed: $LASTEXITCODE" }

      - name: Install silently and test the installed app
        run: |
          $setup = Get-ChildItem dist\LearningRecorder-Setup-*.exe | Select-Object -First 1
          Write-Host "installer: $($setup.Name) $([math]::Round($setup.Length / 1MB, 1)) MB"
          $dir = "$env:RUNNER_TEMP\installed"
          $p = Start-Process $setup.FullName -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/CURRENTUSER", "/TASKS=desktopicon", "/DIR=`"$dir`"" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "install failed: $($p.ExitCode)" }
          $out = "$env:RUNNER_TEMP\selftest_installed"
          $q = Start-Process "$dir\LearningRecorder.exe" -ArgumentList "--selftest", "`"$out`"" -PassThru
          if (-not $q.WaitForExit(240000)) { Stop-Process -Id $q.Id -Force; throw "installed selftest timeout" }
          if ($q.ExitCode -ne 0) { throw "installed selftest failed: $($q.ExitCode)" }
          $u = Start-Process "$dir\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES" -Wait -PassThru
          Write-Host "uninstall exit: $($u.ExitCode)"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: LearningRecorder-Setup
          path: learning-recorder/dist/LearningRecorder-Setup-*.exe

      - name: Upload test results (screenshots, samples)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/ui_shots
            ${{ runner.temp }}/selftest_exe
